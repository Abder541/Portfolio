<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Inter', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <style>
      .table-box { fill: #111827; stroke: #374151; stroke-width: 1.5; rx: 10; ry: 10; }
      .table-header { fill: #1e293b; rx: 10; ry: 10; }
      .table-header-mask { fill: #1e293b; }
      .table-title { fill: #7c5cfc; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; }
      .col-pk { fill: #fbbf24; font-size: 11.5px; font-weight: 600; }
      .col-name { fill: #e2e8f0; font-size: 11.5px; }
      .col-fk { fill: #38bdf8; font-size: 11.5px; font-style: italic; }
      .col-type { fill: #64748b; font-size: 10.5px; }
      .relation-line { stroke: #4f8ef7; stroke-width: 1.8; fill: none; }
      .relation-arrow { fill: #4f8ef7; }
      .relation-label { fill: #64748b; font-size: 9.5px; font-weight: 500; }
      .pk-icon { fill: #fbbf24; font-size: 9px; }
      .fk-icon { fill: #38bdf8; font-size: 9px; }
    </style>
  </defs>

  <!-- ========== USERS TABLE ========== -->
  <g transform="translate(20, 30)">
    <rect class="table-box" width="180" height="150" />
    <rect class="table-header" width="180" height="34" />
    <rect class="table-header-mask" x="0" y="24" width="180" height="10" />
    <text class="table-title" x="90" y="23" text-anchor="middle">users</text>
    <line x1="0" y1="34" x2="180" y2="34" stroke="#374151" stroke-width="1"/>
    <text class="pk-icon" x="12" y="52">PK</text><text class="col-pk" x="34" y="52">id</text><text class="col-type" x="140" y="52">BIGINT</text>
    <text class="col-name" x="14" y="72">name</text><text class="col-type" x="140" y="72">VARCHAR</text>
    <text class="col-name" x="14" y="92">email</text><text class="col-type" x="140" y="92">VARCHAR</text>
    <text class="col-name" x="14" y="112">password</text><text class="col-type" x="140" y="112">VARCHAR</text>
    <text class="col-name" x="14" y="132">timestamps</text><text class="col-type" x="140" y="132">DATETIME</text>
  </g>

  <!-- ========== CATEGORIES TABLE ========== -->
  <g transform="translate(20, 280)">
    <rect class="table-box" width="180" height="110" />
    <rect class="table-header" width="180" height="34" />
    <rect class="table-header-mask" x="0" y="24" width="180" height="10" />
    <text class="table-title" x="90" y="23" text-anchor="middle">categories</text>
    <line x1="0" y1="34" x2="180" y2="34" stroke="#374151" stroke-width="1"/>
    <text class="pk-icon" x="12" y="52">PK</text><text class="col-pk" x="34" y="52">id</text><text class="col-type" x="140" y="52">BIGINT</text>
    <text class="col-name" x="14" y="72">name</text><text class="col-type" x="140" y="72">VARCHAR</text>
    <text class="col-name" x="14" y="92">slug</text><text class="col-type" x="140" y="92">VARCHAR</text>
  </g>

  <!-- ========== PRODUCTS TABLE ========== -->
  <g transform="translate(350, 140)">
    <rect class="table-box" width="195" height="190" />
    <rect class="table-header" width="195" height="34" />
    <rect class="table-header-mask" x="0" y="24" width="195" height="10" />
    <text class="table-title" x="97" y="23" text-anchor="middle">products</text>
    <line x1="0" y1="34" x2="195" y2="34" stroke="#374151" stroke-width="1"/>
    <text class="pk-icon" x="12" y="52">PK</text><text class="col-pk" x="34" y="52">id</text><text class="col-type" x="150" y="52">BIGINT</text>
    <text class="fk-icon" x="12" y="72">FK</text><text class="col-fk" x="34" y="72">category_id</text><text class="col-type" x="150" y="72">BIGINT</text>
    <text class="col-name" x="14" y="92">name</text><text class="col-type" x="150" y="92">VARCHAR</text>
    <text class="col-name" x="14" y="112">description</text><text class="col-type" x="150" y="112">TEXT</text>
    <text class="col-name" x="14" y="132">price</text><text class="col-type" x="150" y="132">DECIMAL</text>
    <text class="col-name" x="14" y="152">image</text><text class="col-type" x="150" y="152">VARCHAR</text>
    <text class="col-name" x="14" y="172">timestamps</text><text class="col-type" x="150" y="172">DATETIME</text>
  </g>

  <!-- ========== CART_ITEMS TABLE ========== -->
  <g transform="translate(350, 10)">
    <rect class="table-box" width="195" height="130" />
    <rect class="table-header" width="195" height="34" />
    <rect class="table-header-mask" x="0" y="24" width="195" height="10" />
    <text class="table-title" x="97" y="23" text-anchor="middle">cart_items</text>
    <line x1="0" y1="34" x2="195" y2="34" stroke="#374151" stroke-width="1"/>
    <text class="pk-icon" x="12" y="52">PK</text><text class="col-pk" x="34" y="52">id</text><text class="col-type" x="150" y="52">BIGINT</text>
    <text class="fk-icon" x="12" y="72">FK</text><text class="col-fk" x="34" y="72">user_id</text><text class="col-type" x="150" y="72">BIGINT</text>
    <text class="fk-icon" x="12" y="92">FK</text><text class="col-fk" x="34" y="92">product_id</text><text class="col-type" x="150" y="92">BIGINT</text>
    <text class="col-name" x="14" y="112">quantity</text><text class="col-type" x="150" y="112">INT</text>
  </g>

  <!-- ========== ORDERS TABLE ========== -->
  <g transform="translate(680, 10)">
    <rect class="table-box" width="195" height="170" />
    <rect class="table-header" width="195" height="34" />
    <rect class="table-header-mask" x="0" y="24" width="195" height="10" />
    <text class="table-title" x="97" y="23" text-anchor="middle">orders</text>
    <line x1="0" y1="34" x2="195" y2="34" stroke="#374151" stroke-width="1"/>
    <text class="pk-icon" x="12" y="52">PK</text><text class="col-pk" x="34" y="52">id</text><text class="col-type" x="150" y="52">BIGINT</text>
    <text class="fk-icon" x="12" y="72">FK</text><text class="col-fk" x="34" y="72">user_id</text><text class="col-type" x="150" y="72">BIGINT</text>
    <text class="col-name" x="14" y="92">total</text><text class="col-type" x="150" y="92">DECIMAL</text>
    <text class="col-name" x="14" y="112">status</text><text class="col-type" x="150" y="112">VARCHAR</text>
    <text class="col-name" x="14" y="132">stripe_session</text><text class="col-type" x="150" y="132">VARCHAR</text>
    <text class="col-name" x="14" y="152">timestamps</text><text class="col-type" x="150" y="152">DATETIME</text>
  </g>

  <!-- ========== ORDER_ITEMS TABLE ========== -->
  <g transform="translate(680, 280)">
    <rect class="table-box" width="195" height="150" />
    <rect class="table-header" width="195" height="34" />
    <rect class="table-header-mask" x="0" y="24" width="195" height="10" />
    <text class="table-title" x="97" y="23" text-anchor="middle">order_items</text>
    <line x1="0" y1="34" x2="195" y2="34" stroke="#374151" stroke-width="1"/>
    <text class="pk-icon" x="12" y="52">PK</text><text class="col-pk" x="34" y="52">id</text><text class="col-type" x="150" y="52">BIGINT</text>
    <text class="fk-icon" x="12" y="72">FK</text><text class="col-fk" x="34" y="72">order_id</text><text class="col-type" x="150" y="72">BIGINT</text>
    <text class="fk-icon" x="12" y="92">FK</text><text class="col-fk" x="34" y="92">product_id</text><text class="col-type" x="150" y="92">BIGINT</text>
    <text class="col-name" x="14" y="112">quantity</text><text class="col-type" x="150" y="112">INT</text>
    <text class="col-name" x="14" y="132">price</text><text class="col-type" x="150" y="132">DECIMAL</text>
  </g>

  <!-- ========== RELATIONS ========== -->
  <!-- users -> cart_items (1:N) -->
  <path class="relation-line" d="M200,90 L350,70" />
  <polygon class="relation-arrow" points="350,70 340,65 340,75" />
  <text class="relation-label" x="265" y="70">1:N</text>

  <!-- users -> orders (1:N) -->
  <path class="relation-line" d="M200,105 C300,105 400,60 680,60" />
  <polygon class="relation-arrow" points="680,60 670,55 670,65" />
  <text class="relation-label" x="430" y="50">1:N</text>

  <!-- products -> cart_items (1:N) -->
  <path class="relation-line" d="M447,140 L447,120" />
  <polygon class="relation-arrow" points="447,140 442,130 452,130" />
  <text class="relation-label" x="454" y="133">1:N</text>

  <!-- categories -> products (1:N) -->
  <path class="relation-line" d="M200,320 L350,230" />
  <polygon class="relation-arrow" points="350,230 340,225 343,235" />
  <text class="relation-label" x="258" y="265">1:N</text>

  <!-- orders -> order_items (1:N) -->
  <path class="relation-line" d="M777,180 L777,280" />
  <polygon class="relation-arrow" points="777,280 772,270 782,270" />
  <text class="relation-label" x="784" y="235">1:N</text>

  <!-- products -> order_items (1:N) -->
  <path class="relation-line" d="M545,290 C620,310 660,320 680,340" />
  <polygon class="relation-arrow" points="680,340 672,332 678,342" />
  <text class="relation-label" x="605" y="305">1:N</text>

  <!-- Legend -->
  <g transform="translate(260, 460)">
    <rect x="0" y="0" width="380" height="42" rx="8" ry="8" fill="#111827" stroke="#374151" stroke-width="1" />
    <text class="pk-icon" x="16" y="17">PK</text><text style="fill:#94a3b8; font-size:10px;" x="36" y="17">= Primary Key</text>
    <text class="fk-icon" x="140" y="17">FK</text><text style="fill:#94a3b8; font-size:10px;" x="160" y="17">= Foreign Key</text>
    <text style="fill:#94a3b8; font-size:10px;" x="262" y="17">──▶ = Relation 1:N</text>
    <text style="fill:#64748b; font-size:9.5px;" x="16" y="35">MySQL 8.x · 6 tables · Laravel Eloquent ORM</text>
  </g>
</svg>