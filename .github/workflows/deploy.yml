# GitHub Actions — Déploiement automatique sur GitHub Pages
# Déclenché sur chaque push vers la branche v2
# Build SvelteKit (adapter-static) → publie le dossier build/ sur gh-pages

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v2
  # Permet de déclencher manuellement depuis l'onglet Actions
  workflow_dispatch:

# Autorisations nécessaires pour pousser sur gh-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois (annule le précédent si en cours)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
